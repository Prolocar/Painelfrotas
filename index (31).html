<!doctype html>

<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.3 Inter,system-ui,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px;text-align:center;min-width:92px}
.kpi b{display:block;font-size:clamp(20px,2vw,34px);line-height:1.1}.kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.kpi.alert b{color:#fbbf24}
.bar{display:flex;gap:8px;padding:10px 20px;align-items:center;flex-wrap:wrap}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
button{cursor:pointer;font-weight:600}button:hover{border-color:#3b4d78}
.pri{background:#3b6cf6;border-color:#3b6cf6}.dng{color:#fca5a5;border-color:#5b2530}
.leg{display:flex;gap:6px;margin-left:auto}
.lg{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600}
.lg i{width:10px;height:10px;border-radius:3px}.lg.off{opacity:.35}
main{font-size:var(--fs,14px);grid-template-rows:minmax(0,1fr);flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 20px 8px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ct{padding:.6em .9em;font-size:1.15em;font-weight:800;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:center;align-items:center;gap:.7em;color:#0a0f1c}
.ct em{font-style:normal;background:#0a0f1c33;border-radius:20px;padding:0 10px}
.c0 .ct{background:#d5e63a}.c1 .ct{background:#9fd08a}.c2 .ct{background:#ef4444;color:#fff}.c3 .ct{background:#22b94a;color:#fff}
.lanes{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:8px}
.lane{min-width:0;border:1px dashed var(--line);border-radius:10px;padding:7px 8px 8px;transition:.15s}
.lane.over{background:#1a2748;border-color:#3b6cf6}
.lh{font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:6px}
.chips{display:flex;gap:.4em;align-items:flex-start;min-height:22px}
.tg{flex:var(--sc,1) 1 0;min-width:calc(var(--sc,1)*6.6em + (var(--sc,1) - 1)*.4em);display:flex;flex-direction:column;gap:.35em}
.cl{display:flex;flex-direction:column;gap:.35em;min-width:0}
body.tv .cl{display:block;column-count:var(--sc,1);column-gap:.4em;column-fill:balance}body.tv .cl .chip{break-inside:avoid;margin-bottom:.35em;box-sizing:border-box}body.tv .cl .chip:last-child{margin-bottom:0}
.th>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.th{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--t);border-bottom:2px solid var(--t);padding:0 2px 3px;display:flex;justify-content:space-between;gap:.5em;white-space:nowrap}
.tg .chip{width:100%}
.chip{background:#17223b;border:1px solid var(--line);border-left:5px solid var(--t);border-radius:8px;padding:.26em .5em;cursor:grab;font-weight:700;font-variant-numeric:tabular-nums;font-size:1em;position:relative}
.chip:hover{background:#1f2d4d}
.chip small{display:block;font-size:.72em;font-weight:600;color:var(--mut);margin-top:2px}
.chip .k{position:absolute;top:-6px;right:-4px;background:#3b6cf6;border-radius:6px;font-size:.6em;padding:1px 5px}
.chip.cor{background:#3a1519;border-color:#7f2a33;border-left-color:var(--t)}.chip.cor small{color:#f1f5f9}
.chip.soon{animation:pl 1s infinite;background:#3a2a05;border-color:#f59e0b}
.chip.over-due{animation:pl .8s infinite;background:#7f1d1d;border-color:#ef4444}
@keyframes pl{50%{box-shadow:0 0 0 4px #f59e0b55}}
.lh{cursor:grab;user-select:none}.lh:active{cursor:grabbing}.col.over{outline:2px dashed #3b6cf6;outline-offset:-3px}
.chip .kd{font-weight:900;font-size:.85em;color:#fbbf24}.chip .kdR{color:#c4b5fd}
.chip.late{animation:pl .8s infinite;background:#7f1d1d;border-color:#ef4444}.chip.na{background:#3a1519;border-color:#ef4444}.chip.na .nat,.chip.mir .mt2{color:#fca5a5}.chip.mir{border-style:dashed}.ke{color:#fbbf24;margin-left:.4em}.kr{color:#c4b5fd;margin-left:.3em}
.empty{color:#3d4b6b;font-size:.8em}
.foot{padding:4px 20px 8px;color:var(--mut);font-size:11px}
.cred{padding:0 20px 8px;color:var(--mut);font-size:11px;text-align:left;opacity:.8}body.tv .cred{padding:0 16px 8px;font-size:clamp(10px,.8vw,14px)}
body.tv{overflow:hidden;cursor:none;height:100vh}body.tv .lanes{overflow:hidden;grid-template-columns:repeat(var(--n,1),minmax(0,1fr))}body.tv main{grid-template-columns:minmax(0,1fr) minmax(0,3.6fr) minmax(0,1.3fr) minmax(0,1fr)}body.tv h1{font-size:clamp(22px,2.2vw,44px)}body.tv .clock{font-size:clamp(16px,1.5vw,30px)}body.tv .kpi b{font-size:clamp(26px,2.6vw,52px)}body.tv .kpi span{font-size:clamp(11px,.9vw,18px)}
body.tv .bar,body.tv .foot{display:none}body.tv .leg{margin-left:auto}body.tv .kpis{margin-left:0}body.tv .lg{cursor:none;font-size:clamp(11px,1vw,20px);padding:.3em .8em}
body.tv header{padding:8px 16px}body.tv main{padding:8px 16px 12px}
body.tv .c1 .lanes{grid-template-columns:repeat(6,minmax(0,1fr))}
body.tv .lane[data-l="Usina - Habitual"]{grid-column:1/4;grid-row:1}
body.tv .lane[data-l="Usina - Eventual"]{grid-column:1/4;grid-row:2}
body.tv .lane[data-l="Vagões"]{grid-column:1/2;grid-row:3}
body.tv .lane[data-l="Locomotivas"]{grid-column:2/3;grid-row:3}
body.tv .lane[data-l="Pátio de Insumo"]{grid-column:3/4;grid-row:3}
body.tv .lane[data-l="Porto - Habitual"]{grid-column:4/7;grid-row:1}
body.tv .lane[data-l="Porto - Eventual"]{grid-column:4/7;grid-row:2/span 2}
body.tv .c0 .lh>span:first-child{white-space:nowrap}body.tv .c0 .lanes{padding:10px}body.tv .c0 .lane{padding:9px 10px 10px}
body.tv .lane.vz{padding:.3em .7em}body.tv .lane.vz .lh{margin:0}body.tv .lane.vz .chips{display:none}
body.tv header{gap:6px 14px}body.tv #ver{display:none}body.tv h1{font-size:clamp(20px,1.7vw,38px);white-space:nowrap}body.tv .clock{font-size:clamp(14px,1.15vw,26px);white-space:nowrap}body.tv .tvbar input{width:7em}
body.tv .chip{padding:.12em .45em;line-height:1.15;height:auto;min-height:0;align-self:start}body.tv .chip small{margin-top:0;line-height:1.1}body.tv .th{letter-spacing:.2px}body.tv .lg,body.tv .tvbar button,body.tv .kpi{white-space:nowrap}body.tv .leg{gap:.4em}body.tv .kpi{min-width:0;padding:4px 14px}
.mb{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}.mb.open{display:flex}
.md{width:min(38em,96vw);font-size:var(--mfs,14px);background:#0f1729;border:1px solid var(--line);border-radius:1em;padding:1.4em;max-height:94vh;overflow:auto}

.act{display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap;margin-top:.8em}
#fsh{display:none}
.tvbar{display:none;gap:8px;align-items:center}
body.tv .tvbar{display:flex}
body.tv .tvbar input{width:9em}
body.tv .tvbar input,body.tv .tvbar button{font-size:clamp(12px,1vw,20px);padding:.35em .8em}
body.tv.mv,body.tv.mv *{cursor:auto!important}
.md button.on{background:#b45309;border-color:#f59e0b;color:#fff}
.chip.cor small.aw{color:#fbbf24}

body.tv:not(.isfs) #fsh{display:block}

/* ===== v9: caixas justas + visual (vale para TV e tela normal) ===== */
body{background:radial-gradient(1200px 500px at 50% -150px,#16223f 0,var(--bg) 70%) fixed}
header{background:#0c1324cc;backdrop-filter:blur(6px)}
.col{background:linear-gradient(180deg,#121c33,#0e1628);box-shadow:0 6px 20px #0006;border-color:#243354}
.ct{box-shadow:0 2px 0 #0003;text-shadow:0 1px 0 #ffffff22}
.lane{background:#0d1526;border:1px solid #1d2a47;border-radius:10px}
.lane.vz{opacity:.7}
.lh{color:#a7b4d0;letter-spacing:.9px;padding-bottom:3px}
.chip{background:linear-gradient(180deg,#1b2845,#16223b);border-color:#263759;border-radius:6px;padding:.14em .5em;line-height:1.15;height:auto;min-height:0;align-self:start;box-shadow:0 1px 2px #0005}
.chip:hover{background:linear-gradient(180deg,#25365d,#1d2d4f)}
.chip small{margin-top:0;line-height:1.1}
.chip.cor,.chip.na{background:linear-gradient(180deg,#43181d,#33141a)}
.th{font-size:.7em;margin-bottom:.15em}
.kpi{background:linear-gradient(180deg,#16213a,#101a2e);box-shadow:0 2px 10px #0005}
.lg{background:#111a2e;border-color:#243354;transition:.15s}.lg:hover{border-color:#3b6cf6}
/* Vagões / Locomotivas / Pátio: frotas lado a lado em vez de barras largas */
.lane[data-l="Vagões"] .tg,.lane[data-l="Locomotivas"] .tg,.lane[data-l="Pátio de Insumo"] .tg{flex:1 1 100%;min-width:0}
.lane[data-l="Vagões"] .cl,.lane[data-l="Locomotivas"] .cl,.lane[data-l="Pátio de Insumo"] .cl{display:flex!important;flex-direction:column;flex-wrap:nowrap;gap:.35em;column-count:auto}
.lane[data-l="Vagões"] .chip,.lane[data-l="Locomotivas"] .chip,.lane[data-l="Pátio de Insumo"] .chip{width:100%;flex:0 0 auto;min-width:0;margin:0}

/* ===== v10: faixa executiva dinâmica ===== */
.dash{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,2.2fr);gap:10px;padding:2px 20px 10px}
.dc{position:relative;background:linear-gradient(180deg,#16213a,#0f182c);border:1px solid #243354;border-radius:12px;padding:10px 14px 12px;overflow:hidden;box-shadow:0 4px 14px #0005}
.dc:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c,#3b6cf6)}
.dc small{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.dc b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.dc i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}
.dc .pb{height:5px;border-radius:5px;background:#0a0f1c;margin-top:8px;overflow:hidden}.dc .pb u{display:block;height:100%;width:0;background:var(--c,#3b6cf6);border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.dc.al{border-color:#7f2a33}.dc.al b{color:#fca5a5}.dc.al:before{animation:dp 1.6s infinite}
@keyframes dp{50%{opacity:.25}}
.dc.mix .sb{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#0a0f1c;margin-top:8px}
.dc.mix .sb span{height:100%;min-width:0;transition:flex .8s cubic-bezier(.2,.8,.2,1)}
.dc.mix .sl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;font-weight:600}
.dc.mix .sl em{font-style:normal;display:flex;align-items:center;gap:5px}.dc.mix .sl em:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--t)}
body.tv .dash{padding:0 16px 8px;gap:8px}body.tv .dc{padding:6px 12px 8px}body.tv .dc b{font-size:28px}body.tv .dc i{display:none}body.tv .dc .pb{margin-top:5px}

/* ===== v11: correção do transbordo/repetição no rodapé da TV ===== */
html{overflow:hidden}
body.tv{background:#0a0f1c;overflow:hidden;contain:paint}
body.tv header{backdrop-filter:none;-webkit-backdrop-filter:none;background:#0c1324}

<script>
const SECS=[{t:"Disponível",l:["Disponível","Vistoria MEV","Mob","Desmob"]},{t:"Programado",n:2,l:["Usina - Habitual","Porto - Habitual","Usina - Eventual","Porto - Eventual","Vagões","Locomotivas","Pátio de Insumo"]},{t:"Manutenção",l:["Manutenção - Vale"]},{t:"Filial",l:["Spot","Disponível - Filial","Manutenção - Filial"]}];

try{if(new URLSearchParams(location.search).get("tv")==="1")throw 0;const sv=JSON.parse(localStorage.getItem(LK));if(Array.isArray(sv)&&sv.length===SECS.length){const f=sv.flat();if(f.length===NAMES.length&&NAMES.every(n=>f.filter(y=>y===n).length===1))SECS.forEach((s,i)=>s.l=sv[i])}}catch(e){}
const saveLayout=()=>{try{localStorage.setItem(LK,JSON.stringify(SECS.map(s=>s.l)))}catch(e){}render()};
const CODES={"Disponível":["40/100/45"],"Vistoria MEV":["80/10/17","40/250/18"],"Usina - Habitual":["40/250/38","40/250/16","40/120/02","40/85/19","40/100/42","76/16/02","76/07/14","76/07/12","76/04/13","76/04/12","76/04/05","76/03/09","76/03/08","76/03/07","76/03/06","76/03/03","76/04/18","80/10/18","80/10/13","80/10/12","80/10/04","80/10/03","80/10/02","80/10/01"],"Vagões":["76/04/17","76/04/16","76/04/11"],"Locomotivas":["76/04/09","76/05/04"],"Pátio de Insumo":["76/07/08"],"Porto - Habitual":["40/250/37","40/250/36","40/110/22","40/110/19","40/100/33","40/30/58","46/14/03","46/10/06","46/10/04","76/07/13","76/04/03","80/22/09","80/10/20","80/10/19","80/10/17","80/10/15","80/10/14","80/10/11","80/10/10","80/10/08","80/10/06","80/10/05"],"Manutenção - Vale":["46/10/08","76/03/03","76/03/08"],"Disponível - Filial":["40/250/15"]};
const TYPES={guindaste:["Guindaste","--gu"],ormig:["Ormig","--or"],guindauto:["Guindauto","--ga"],empilhadeira:["Empilhadeira","--em"],cavalo:["Cavalo","--ca"]};
const ORDER=["ormig","guindaste","guindauto","empilhadeira","cavalo"],PADRAO=52,MN="Manutenção - Vale";
const typ=c=>c.startsWith("40/")?"guindaste":c.startsWith("76/")?"empilhadeira":c.startsWith("80/")?"guindauto":c.startsWith("46/")?"ormig":"guindaste";
const KL={E:"Eventual",R:"Reserva"},LBL=n=>n==="Disponível"?"Disponível - Vale":n;
const nr=t=>{t=String(t||"");return(t.length>2&&t===t.toUpperCase()&&t!==t.toLowerCase())?t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):t};const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const init=()=>{const d={};NAMES.forEach(n=>d[n]=(CODES[n]||[]).map((code,i)=>({id:n+"-"+i+"-"+code,code,cat:typ(code),...(n==="Vistoria MEV"?{mevExpired:true}:{})})));d["Disponível - Filial"][0].mev="2026-09-09";return d};
const KEY="programacao-equipamentos-state-v4";
const valid=v=>v&&typeof v==="object"&&NAMES.every(n=>Array.isArray(v[n])&&v[n].every(x=>x&&typeof x.code==="string"&&typeof x.id==="string"&&typeof x.cat==="string"));
let data;try{const s=JSON.parse(localStorage.getItem(KEY));data=valid(s)?s:init()}catch(e){data=init()}
let aw=false,dl=null,drag=null,editing=null,filt=new Set(),ready=false,snap=null,tmr=null,busy=false;
/* ordem: tonelada/capacidade (2º número) do maior p/ o menor; empate: perfil e depois quantidade (maior p/ menor) */
const nat=(a,b)=>{const x=a.split("/").map(Number),y=b.split("/").map(Number);return(y[1]||0)-(x[1]||0)||(y[0]||0)-(x[0]||0)||(y[2]||0)-(x[2]||0)};

const delMirror=id=>NAMES.forEach(n=>{data[n]=data[n].filter(y=>y.mirrorOf!==id)}),getMirror=id=>NAMES.flatMap(n=>data[n]).find(y=>y.mirrorOf===id);
